# Free checks on every push and pull request: no API key, no model calls, no cost.
# The paid golden-set evals (npm run eval:*) are run by hand only — see EVALS.md.
name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
